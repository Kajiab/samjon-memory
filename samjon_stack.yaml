# Samjon Memory - Portainer stack (Standalone / Docker).
#
# Deploy via Portainer > Stacks > Add stack > paste this file (or point the repo
# where Stack files = "samjon_stack.yaml"). Bind mounts below use ABSOLUTE host
# paths because Portainer treats relative bind paths ambiguously.
#
# EDIT THESE PATHS for your machine before deploying. The following are EXAMPLES
# only (Windows-style shown; use POSIX paths on Linux):
#   - "D:/HomeAssistant/samjon-memory/data:/app/data"
#   - "D:/HomeAssistant/samjon-memory/category-covers:/app/category-covers:ro"
#
# Do not commit real secrets. Provide them via Portainer's stack "Environment
# variables" (or a stack .env). Every bind source is an absolute placeholder.
services:
  samjon-memory:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: samjon-memory:local
    container_name: samjon-memory
    restart: unless-stopped
    init: true
    ports:
      - "${SAMJON_CORE_PORT:-8100}:8100"
    environment:
      SAMJON_CORE_ENV: "production"
      SAMJON_CORE_HOST: "0.0.0.0"
      SAMJON_CORE_PORT: "8100"
      SAMJON_CORE_DATABASE_PATH: "/app/data/samjon_core.sqlite"
      SAMJON_RESOLVER_DATABASE_PATH: "/app/data/samjon_resolver.sqlite"
      SAMJON_RESOLVER_FTS5_REQUIRED: "${SAMJON_RESOLVER_FTS5_REQUIRED:-true}"
      SAMJON_MEDIA_ROOT: "/app/data/media"
      SAMJON_CATEGORY_COVERS_ROOT: "/app/category-covers"
      SAMJON_CORE_LOG_LEVEL: "${SAMJON_CORE_LOG_LEVEL:-INFO}"
      SAMJON_CORE_PORTAL_ENABLED: "true"
      SAMJON_CORE_CORS_ORIGINS: "${SAMJON_CORE_CORS_ORIGINS:-*}"
      # Secrets: provide via Portainer stack environment (or a .env) - see docs.
      SAMJON_CORE_SERVICE_TOKEN: "${SAMJON_CORE_SERVICE_TOKEN:-}"
      SAMJON_CORE_ADMIN_TOKEN: "${SAMJON_CORE_ADMIN_TOKEN:-}"
      SAMJON_CORE_READ_TOKEN: "${SAMJON_CORE_READ_TOKEN:-}"
      SAMJON_PORTAL_USERNAME: "${SAMJON_PORTAL_USERNAME:-}"
      SAMJON_PORTAL_PASSWORD: "${SAMJON_PORTAL_PASSWORD:-}"
      SAMJON_PORTAL_ALLOWED_ORIGINS: "${SAMJON_PORTAL_ALLOWED_ORIGINS:-http://localhost:8100,http://127.0.0.1:8100}"
      SAMJON_LIFECYCLE_AUTOMATIC_PURGE_ENABLED: "${SAMJON_LIFECYCLE_AUTOMATIC_PURGE_ENABLED:-false}"
    volumes:
      - type: bind
        source: /absolute/path/to/samjon-memory/data
        target: /app/data
      - type: bind
        source: /absolute/path/to/samjon-memory/category-covers
        target: /app/category-covers
        read_only: true
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s