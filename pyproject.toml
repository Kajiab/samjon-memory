[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samjon-memory"
version = "1.0.0"
description = "Samjon Memory Core Foundation V1 - Durable structured household knowledge backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
	"uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]